  }

  function prompt() {
    const list = selectedItems().map(item => `${item.number}. ${item.title}`).join('\n');
    return `Я выбрал пункты из каталога Go / Юлдаш от 19.10.2026 (${catalog.id}):\n${list}\nСначала проверь их поведение и что уже есть в Юлдаше. Составь понятный план: что полезно, что потребуется и какие есть риски. Этот выбор означает интерес к изучению: пока ничего не внедряй. Отдельного согласия на деньги, тарифы, изменение данных, выкладку, push или слияние в main я не даю.`;
  }

  function update() {
    for (const [id, input] of inputs) input.checked = selected.has(id);
    count.textContent = `Выбрано: ${selected.size}`;
    submit.disabled = pending || selected.size === 0;
    text.value = selected.size ? prompt() : '';
  }

  function restore(state) {
    const saved = state && state.modelContent;
    selected = new Set(saved && saved.catalogId === catalog.id && Array.isArray(saved.selectedIds)
      ? saved.selectedIds.filter(id => validIds.has(id)) : []);
    fallback.hidden = true;
    update();
  }

  function save() {
    const api = window.openai;
    if (!api || typeof api.setWidgetState !== 'function') return;
    const state = {
      modelContent: { catalogId: catalog.id, selectedIds: selectedItems().map(item => item.id), selectedNumbers: selectedItems().map(item => item.number) },
      privateContent: null
    };
    try { Promise.resolve(api.setWidgetState(state)).catch(() => {}); } catch (_) {}
  }

  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail && event.detail.globals;
    if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) restore(globals.widgetState);
  });

  submit.addEventListener('click', async () => {
    if (!selected.size || pending) return;
    const api = window.openai;
    if (!api || typeof api.sendFollowUpMessage !== 'function') {
      fallback.hidden = false;
      text.focus();
      text.select();
      return;
    }
    pending = true;
    update();
    try {
      await api.sendFollowUpMessage({ prompt: prompt(), title: 'Разобрать выбранные возможности' });
    } catch (_) {
      fallback.hidden = false;
    } finally {
      pending = false;
      update();
    }
  });

  restore(window.openai && window.openai.widgetState);
})();
</script>
