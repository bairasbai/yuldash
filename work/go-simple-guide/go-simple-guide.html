льзовать его как заготовку следующего заказа.","problem":"Для одинаковых поездок приходится заново выбирать начальную точку, конечную точку и подходящие настройки.","why":"Заготовка уменьшает повторяющиеся действия, а перед подтверждением остаётся проверить, всё ли подходит сегодня.","yuldash":"Юлдашу это может пригодиться для регулярных поездок на работу, если сохранённые условия ясно видны.","tradeoff":"Прежние условия могут устареть, поэтому повтор поездки не должен незаметно переносить неподходящее время или пожелания.","uncertainty":"Не установлено, какие настройки относятся к избранной поездке и отличается ли она от сохранённого маршрута.","scope_hint":"Удобство","id":"G006","topic":"Адреса и встреча","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":35,"existing_yuldash_status":"Частично / другой сценарий"},{"number":7,"original_title":"Предложения вероятного пункта назначения","simple_title":"Подсказать, куда ты собираешься","what":"Приложение могло бы предложить работу как вероятный адрес, когда ты открываешь его перед привычной поездкой.","problem":"Среди множества сохранённых и недавних мест приходится каждый раз искать одно и то же направление.","why":"Подходящая подсказка экономит действия, если человек сам выбирает её и может легко отказаться.","yuldash":"Юлдашу идея полезна для повторяющихся направлений после проверки, нужны ли людям такие персональные предложения.","tradeoff":"Неверная догадка раздражает, а использование истории поездок требует бережного отношения к привычкам человека.","uncertainty":"Название говорит о вероятных направлениях, но основание подсказок и использование истории не установлены.","scope_hint":"Удобство","id":"G007","topic":"Адреса и встреча","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","sour d":"G009","topic":"Адреса и встреча","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":43,"existing_yuldash_status":"Не подтверждено"},{"number":10,"original_title":"Пеший участок у альтернативной точки","simple_title":"Показать, как дойти до места встречи","what":"После выбора соседней точки карта могла бы показать пеший путь от тебя до места посадки.","problem":"Две близкие отметки могут разделять забор, переход или закрытый двор, и прямой путь окажется недоступен.","why":"Понятный путь помогает оценить прогулку заранее и не искать проход, пока водитель уже ждёт.","yuldash":"Юлдашу такая подсказка полезна при встречах у трассы или остановки, если известен безопасный подход.","tradeoff":"Пеший путь нужно проверять отдельно от автомобильного, а его пригодность для конкретного человека нельзя обещать заранее.","uncertainty":"Неясно, относится найденный пеший участок к посадке, высадке или обоим случаям.","scope_hint":"Для поездок","id":"G010","topic":"Адреса и встреча","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":44,"existing_yuldash_status":"Не подтверждено"},{"number":11,"original_title":"Подача по фотографии","simple_title":"Объяснить место встречи фотографией","what":"Фотография ворот или входа могла бы помочь понять, у какого именно ориентира нужно встретиться.","problem":"Одинаковые подъезды и незнакомые дворы трудно описать словами, особенно когда человек приехал впервые.","why":"Узнаваемое изображение позволяет сравнить место вокруг себя с ориентиром и быстрее договориться о встрече.","yuldash":"Юлдашу идею можно изучить для сложных мест посадки после выяснения, как именно используется фотография.","tradeoff":"На снимок могут попасть люди и личные детали, а в темноте знакомый ориентир выглядит иначе.","uncertaint ельное междугороднее такси нужно рассматривать самостоятельно.","tradeoff":"Ещё один вид оформления усложняет переходы, поэтому человек должен понимать, какую именно поездку он сейчас выбирает.","uncertainty":"Найден отдельный экран междугороднего такси, но его содержимое и связь с другими заказами не установлены.","scope_hint":"Для поездок","id":"G013","topic":"Заказ и поездка","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":52,"existing_yuldash_status":"Частично / другой сценарий"},{"number":14,"original_title":"Выбор времени междугородней поездки","simple_title":"Выбрать время дальней поездки","what":"Перед поездкой в другой город человек выбирает подходящее время, например выезд утром после окончания смены.","problem":"Поездка может не подойти по времени, даже если города отправления и прибытия выбраны правильно.","why":"Явный выбор времени позволяет сверить планы до оформления, вместо позднего выяснения с водителем.","yuldash":"Юлдашу это нужно при согласовании времени попутки; для междугороднего такси потребуется отдельная проверка обещаний подачи.","tradeoff":"Выбранное время ещё не гарантирует подходящую машину, поэтому доступность и подтверждение должны быть понятны человеку.","uncertainty":"Неясно, выбирается точное время, промежуток или один из предложенных вариантов междугородней поездки.","scope_hint":"Для поездок","id":"G014","topic":"Заказ и поездка","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":53,"existing_yuldash_status":"Частично / другой сценарий"},{"number":15,"original_title":"Выбор мест в междугородней поездке","simple_title":"Указать, сколько мест нужно в дороге","what":"Для поездки в другой город можно указать, что едут двое и обоим нужны места.","problem":"После договорённости может выясниться pe":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":105,"existing_yuldash_status":"Есть в коде"},{"number":40,"original_title":"Настройка передачи поездки доверенным контактам","simple_title":"Настроить, как делиться поездкой с близкими","what":"В настройках можно определить, какие сведения о поездке разрешено передавать выбранным близким и при каких обстоятельствах.","problem":"Человек может забыть поделиться поездкой или, наоборот, случайно раскрыть подробности тому, кому сейчас не собирался сообщать.","why":"Ясные настройки дают больше контроля и позволяют заранее проверить, подходит ли выбранный способ передачи.","yuldash":"Юлдашу это пригодится, если люди захотят повторять передачу сведений о подтверждённых поездках по понятным им правилам.","tradeoff":"Постоянное разрешение легко забыть, поэтому должны быть заметны получатели, срок доступа и простой способ остановить передачу.","uncertainty":"Название настроек не подтверждает автоматическую отправку и не раскрывает, что именно можно разрешать.","scope_hint":"Для поездок","id":"G040","topic":"Доверие и помощь","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":106,"existing_yuldash_status":"Частично / другой сценарий"},{"number":41,"original_title":"Забытые вещи","simple_title":"Найти вещь, оставленную в машине","what":"Из завершённой поездки можно открыть понятный путь связи по поводу сумки или телефона, оставленного в машине.","problem":"Человек вспоминает о пропаже после выхода и не понимает, как найти водителя именно той поездки.","why":"Связь с конкретной поездкой помогает объяснить, что потерялось, без поиска случайных контактов и пересказа всего пути.","yuldash":"Юлдашу это полезно после попутки, когда участникам нужно договориться о возврате вещи и сохранить уважительное общение.","tradeoff":"Нужно защитить личные контакты и отличать просьбу о возврате от доказательства владения найденной вещью.","uncertainty":"Неизвестно, предлагает найденный экран связь с водителем, обращение в поддержку или другой порядок действий.","scope_hint":"Для поездок","id":"G041","topic":"Доверие и помощь","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":107,"existing_yuldash_status":"Есть в коде"},{"number":42,"original_title":"Инструкции по безопасности","simple_title":"Прочитать понятные действия при опасности","what":"В разделе безопасности можно держать короткие подсказки о действиях в тревожной ситуации во время поездки.","problem":"Когда человек растерялся, длинные правила сложно прочитать, а последовательность нужных действий трудно вспомнить.","why":"Короткая инструкция помогает найти следующий шаг, если она соответствует ситуации и не требует долгого чтения.","yuldash":"Юлдашу такие подсказки пригодятся на русском и башкирском рядом с доступными способами связи и помощью.","tradeoff":"Советы нужно внимательно проверять и обновлять, а общие слова не должны мешать срочному действию при опасности.","uncertainty":"Содержание найденных инструкций неизвестно, поэтому нельзя утверждать, какие опасные ситуации они охватывают.","scope_hint":"Для поездок","id":"G042","topic":"Доверие и помощь","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":108,"existing_yuldash_status":"Частично / другой сценарий"},{"number":43,"original_title":"Заказ для другого пассажира","simple_title":"Оформить такси для другого человека","what":"Ты вызываешь машину для родственника и указываешь, что поедет он, чтобы водитель понимал, кого встречает.","problem":"Водитель ожидает заказавшего, а на месте стоит другой пассажир, с которым никто не согласовал связь.","why":"Явное указание пассажира помогает развести человека, оформляющего заказ, и человека, которому действительно нужна машина.","yuldash":"Юлдашу это пригодится в режиме такси, когда родственник просит помочь с заказом и согласен передать необходимые сведения.","tradeoff":"Нужно бережно передавать имя и контакт пассажира, а заказавшему человеку ясно показывать, какие действия доступны от его имени.","uncertainty":"Не установлены проверка согласия пассажира, состав его данных и способы связи с ним.","scope_hint":"Если будет такси","id":"G043","topic":"Доверие и помощь","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":117,"existing_yuldash_status":"Есть в коде; доступность задаёт сервер"},{"number":44,"original_title":"Выбор особых потребностей пассажира","simple_title":"Заранее учесть особенности пассажира","what":"Перед поездкой человек мог бы указать нужную помощь, например что ему требуется больше времени для посадки.","problem":"Без предварительной договорённости водитель может не понимать, почему обычный порядок встречи не подходит конкретному пассажиру.","why":"Понятный выбор нужной помощи позволяет говорить о практическом условии поездки, не заставляя человека рассказывать лишнее о себе.","yuldash":"Юлдашу идея полезна для доступных попуток, если водитель подтверждает возможность помочь, а чувствительные сведения не собираются без необходимости.","tradeoff":"Обещание помощи создаёт ожидание, поэтому нельзя подменять реальную готовность водителя простой отметкой в форме.","uncertainty":"Набор особых потребностей не раскрыт; приведённый пример поясняет идею и не описывает найденные варианты.","scope_hint":"Для поездок","id":"G044","topic":"Доверие и помощь","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":123,"existing_yuldash_status":"Частично / другой сценарий"},{"number":45,"original_title":"Доступный для экранного диктора обновляемый текст","simple_title":"Услышать важное изменение на экране","what":"Читающая экран программа могла бы произнести новое сообщение, например о прибытии машины, без поиска изменившегося текста пальцем.","problem":"Незрячий человек может не заметить, что на уже открытом экране появилось новое важное состояние поездки.","why":"Своевременное озвучивание помогает следить за поездкой тем, кто воспринимает экран на слух, а не взглядом.","yuldash":"Юлдашу это полезно для доступности обеих языковых версий, особенно при ожидании подтверждения и встрече с водителем.","tradeoff":"Слишком частые объявления перебивают друг друга, поэтому важность и порядок озвучивания нужно проверять на реальном использовании.","uncertainty":"Найден элемент для обновляемого текста, но неизвестно, какие сообщения действительно озвучиваются пользователю.","scope_hint":"Удобство","id":"G045","topic":"Доверие и помощь","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":124,"existing_yuldash_status":"Частично / другой сценарий"},{"number":46,"original_title":"Выбор способа оплаты","simple_title":"Понять, каким способом рассчитаться","what":"Перед подтверждением поездки можно выбрать подходящий из действительно доступных способов оплаты и увидеть его понятное описание.","problem":"Пассажир и водитель могут рассчитывать на разные способы расчёта и обнаружить это только в конце дороги.","why":"Явный выбор заранее помогает договориться и отличить инструкцию для ручного перевода от оплаты самим приложением.","yuldash":"Юлдашу это полезно для ясного объяснения нынешнего ручного перевода через банк; новые способы требуют отдельного согласования Александра.","tradeoff":"Каждый способ должен честно описывать действия человека, иначе выбор создаст ошибочное ожидание уже проведённого платежа.","uncertainty":"Найденный выбор способов оплаты не раскрывает, какие варианты доступны конкретному человеку и как проходят деньги.","scope_hint":"Для поездок","id":"G046","topic":"Оплата и предложения","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":130,"existing_yuldash_status":"Есть в коде"},{"number":47,"original_title":"Добавление банковской карты","simple_title":"Связать банковскую карту с оплатой","what":"Человек мог бы добавить карту как способ оплаты, чтобы при следующих поездках не вводить её данные заново.","problem":"Повторный ввод данных карты неудобен и повышает вероятность ошибки, особенно когда поездка заканчивается и человек спешит.","why":"Однажды выбранный способ упрощает последующий расчёт, если человек понимает, когда и за что возможно списание.","yuldash":"Юлдашу это может понадобиться только при отдельно разрешённой оплате картой; такая возможность не следует из нынешнего ручного перевода.","tradeoff":"Потребуются безопасная работа с платёжными данными, понятное удаление карты и разбор ошибок списания без раскрытия данных карты.","uncertainty":"Не установлено, кто обрабатывает карту и какие правила согласия, списания и удаления предусмотрены.","scope_hint":"Сначала уточнить","id":"G047","topic":"Оплата и предложения","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":131,"existing_yuldash_status":"Пока «Скоро»"},{"number":48,"original_title":"Дополнительное подтверждение карты банком","simple_title":"Подтвердить карту через свой банк","what":"При добавлении карты банк мог бы попросить человека отдельно подтвердить действие, например в своём приложении.","problem":"Одного ввода данных карты недостаточно, чтобы человеку было понятно, какое действие подтверждается isting_yuldash_status":"Частично / другой сценарий"},{"number":50,"original_title":"Подтверждение платежа","simple_title":"Понять, подтверждена ли оплата","what":"После действия с оплатой можно показать понятное состояние: подтверждение получено, ещё ожидается или действие не получилось.","problem":"Человек не понимает, прошёл ли платёж, и может попытаться оплатить повторно или спорить о результате.","why":"Однозначное состояние помогает решить, ждать ли подтверждения или разбираться с ошибкой, без догадок по закрывшемуся окну.","yuldash":"Юлдашу это может пригодиться при отдельно согласованной обработке платежей; ручной перевод нельзя автоматически объявлять проверенным приложением.","tradeoff":"Нужно достоверно связывать состояние с конкретной оплатой и отличать задержку подтверждения от неудачи или повторного платежа.","uncertainty":"Неясно, чьё подтверждение описано найденными данными и что именно считается успешной оплатой.","scope_hint":"Сначала уточнить","id":"G050","topic":"Оплата и предложения","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":134,"existing_yuldash_status":"Не подтверждено"},{"number":51,"original_title":"Неоплаченные поездки и задолженность","simple_title":"Разобраться с поездкой, отмеченной неоплаченной","what":"Отдельный список мог бы показывать поездки, которые система считает неоплаченными, и предлагать разобраться с каждой записью.","problem":"Человек получает непонятное напоминание о долге и не может связать его с конкретной поездкой и обстоятельствами оплаты.","why":"Разбор по поездкам помогает проверить сумму и основание требования, прежде чем совершать какие-либо действия с деньгами.","yuldash":"Юлдашу тема потребует отдельного решения Александра и достоверного учёта оплаты; нынешняя ручная договорённость сама его не обеспечивает.","tradeoff":"Ошибочная задолженность ведёт к конфликту, поэтому нужны проверка з ающих вариантов машины, например когда пассажиру подходят разные уровни удобства для одной поездки.","problem":"Человеку могло бы не понадобиться повторять поиск по очереди в каждом варианте, если его требования допускают несколько решений.","why":"Один осознанный выбор удобен тем, что передаёт гибкость пожеланий и позволяет рассматривать больше подходящих предложений.","yuldash":"Юлдашу это относится к возможному направлению такси с понятными классами машин, а не автоматически к попуткам между своими.","tradeoff":"Нужно объяснять различия выбранных вариантов и денежные условия до подтверждения, чтобы широкий выбор не создавал неожиданностей.","uncertainty":"Правила сочетания классов, минимальное число выбранных вариантов и итоговый расчёт не проверены.","scope_hint":"Если будет такси","id":"G234","topic":"Заказ и поездка","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":69,"existing_yuldash_status":"С Юлдашем не сопоставлено"},{"number":235,"original_title":"Быстрые действия приложения с рабочего стола","simple_title":"Открыть нужное действие с экрана телефона","what":"Идея — быстрый переход прямо от значка приложения, например сразу открыть поиск поездки через дополнительную кнопку на экране телефона.","problem":"Человек мог бы выполнять привычное действие с меньшим числом переходов, когда каждый раз начинает работу с одного места.","why":"Быстрый вход экономит лишние нажатия, если название действия понятное и выбранный раздел открывается предсказуемо.","yuldash":"Юлдашу такая идея пригодилась бы для действительно частой задачи, например начала поиска попутки, без обхода подтверждения заказа.","tradeoff":"Нужно поддерживать переходы на разных телефонах и не раскрывать личные сведения в подписи кнопки на общем экране.","uncertainty":"Какие быстрые действия фактически опубликованы для пользователей, в источнике не установлено.","scope_hint":"Уд ядом.","yuldash":"Юлдашу это могло бы пригодиться как необязательное украшение после решения основных задач поиска, доверия и встречи участников.","tradeoff":"Нужно сохранять узнаваемость, проверить смену на разных телефонах и предусмотреть понятный возврат к исходному значку.","uncertainty":"Пользовательский выбор не доказан: изменение значка может относиться только к внутреннему испытанию вариантов.","scope_hint":"Удобство","id":"G237","topic":"Связь и настройки","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":438,"existing_yuldash_status":"С Юлдашем не сопоставлено"},{"number":238,"original_title":"Загрузка и удаление фотографии пользователя","simple_title":"Добавить или убрать своё фото","what":"Идея — загрузить снимок в личную карточку и иметь способ удалить его, как заменить фотографию в собственной записной книжке.","problem":"Участникам встречи могло бы быть проще узнать друг друга, когда они сами решили показать подходящий снимок.","why":"Управление фотографией удобно тем, что человек может исправить случайный выбор или отказаться от дальнейшего показа изображения.","yuldash":"Для Юлдаша это могло бы помогать доверию и встрече, с добровольным фото и ясным объяснением, кому оно доступно.","tradeoff":"Потребуются защита изображений, понятное удаление и проверка нежелательного содержимого; одна фотография не подтверждает надёжность человека.","uncertainty":"Настоящая загрузка не выполнялась, а круг зрителей и результат удаления фотографии не проверены.","scope_hint":"Для поездок","id":"G238","topic":"Связь и настройки","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":383,"existing_yuldash_status":"С Юлдашем не сопоставлено"},{"number":239,"original_title":"Об приложении: версия, лицензия, политика","simple_title":"Н нее заметить ненужный крюк до выезда.","yuldash":"Юлдашу это относилось бы к самостоятельному навигатору, а изменение согласованной попутки должно отдельно учитываться участниками поездки.","tradeoff":"Потребуются понятный порядок остановок и пересчёт пути; добавление точки на карту не означает согласие других людей на изменение договорённости.","uncertainty":"Число доступных остановок, порядок изменения и влияние на текущий путь не установлены.","scope_hint":"Отдельный сервис","id":"G255","topic":"Другие сервисы","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":462,"existing_yuldash_status":"С Юлдашем не сопоставлено"},{"number":256,"original_title":"Парковка самоката","simple_title":"Разобраться, где оставить самокат","what":"Идея — отдельный экран парковки самоката, как памятка о месте и действиях перед тем, как оставить арендованный транспорт.","problem":"Пользователь мог бы реже путать обычную остановку с местом, где оператор разрешает завершить аренду устройства.","why":"Объяснение парковки рядом с текущим заказом помогает проверить нужные действия до ухода от самоката.","yuldash":"Для Юлдаша это самостоятельное самокатное направление, которое потребует собственных правил работы с оператором и местами парковки.","tradeoff":"Нужно поддерживать актуальные зоны, понятный ответ при отказе и подтверждение завершения, а не полагаться на одну отметку на карте.","uncertainty":"Разрешённые места, проверка стоянки и условия окончательного завершения аренды не установлены.","scope_hint":"Отдельный сервис","id":"G256","topic":"Другие сервисы","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":248,"existing_yuldash_status":"С Юлдашем не сопоставлено"},{"number":257,"original_title":"Самокат: отдельный сценарий для новичка","simple_title":"Отдельный экран для начинающего самокатчика","what":"В каталоге обозначен сценарий для новичка, как отдельный вход для человека, который впервые знакомится с самокатной арендой.","problem":"Начинающему могло бы быть проще понять, с чего начать, если ему не показывают сразу весь набор незнакомых действий.","why":"Отдельный путь знакомства позволяет объяснять нужное последовательно, но сам по себе не подтверждает обучение или особые возможности транспорта.","yuldash":"Для Юлдаша это часть самостоятельного самокатного направления; полезность зависит от того, что действительно входит в сценарий новичка.","tradeoff":"Понадобятся понятные проверенные объяснения и доступ к обычной помощи, без обещания безопасности только из-за прохождения отдельного экрана.","uncertainty":"Обучение, ограничение скорости и длительность сценария не подтверждены.","scope_hint":"Отдельный сервис","id":"G257","topic":"Другие сервисы","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":249,"existing_yuldash_status":"С Юлдашем не сопоставлено"},{"number":258,"original_title":"Страхование доставки","simple_title":"Посмотреть предложение страхования посылки","what":"В каталоге обозначен экран страхования доставки, как отдельное объяснение возможной защиты отправления перед выбором дополнительных условий.","problem":"Отправителю могло бы быть проще увидеть, что именно ему предлагают, вместо предположения о защите любой посылки по умолчанию.","why":"Отдельное знакомство с условиями помогает сопоставить предложение со своей вещью и задать вопросы до принятия решения.","yuldash":"Юлдашу это имело бы смысл при развитии доставки и только после проверки реального партнёра и отдельного решения Александра.","tradeoff":"Потребуются ясные ограничения, подтверждение выбранной услуги и настоящий разбор обращений; нельзя обещать возмещение по одному названию экрана.","uncertainty":"Найдена лишь модель экрана; доступность услуги, страховщик и содержание страхового предложения не установлены.","scope_hint":"Если будет доставка","id":"G258","topic":"Доставка","source_scope":"Go-candidate","source_file":"C:\\Users\\Bayra\\.codex\\worktrees\\yandex-go-study-20261019\\Yuldash\\docs\\yandex-go-full-catalog-20261019.md","source_line":218,"existing_yuldash_status":"С Юлдашем не сопоставлено"}]};
  const topics = root.querySelector('#guide-topics');
  const groups = root.querySelector('#guide-groups');
  const count = root.querySelector('#guide-count');
  const footerCount = root.querySelector('#guide-footer-count');
  const submit = root.querySelector('#guide-submit');
  const fallback = root.querySelector('#guide-fallback');
  const text = root.querySelector('#guide-selection-text');
  const inputById = new Map();
  const fields = [['what', 'Что это'], ['problem', 'Какую проблему решает'], ['why', 'Почему удобно'], ['yuldash', 'Когда нужно Юлдашу'], ['tradeoff', 'Что усложнит работу']];
  let selected = new Set();
  let pending = false;

  for (const [index, topic] of catalog.topics.entries()) {
    const topicId = `guide-topic-${index + 1}`;
    const link = document.createElement('a');
    link.href = `#${topicId}`;
    link.textContent = topic;
    topics.appendChild(link);
    const section = document.createElement('section');
    section.id = topicId;
    const heading = document.createElement('h2');
    heading.textContent = topic;
    section.appendChild(heading);

    for (const item of catalog.items.filter(item => item.topic === topic)) {
      const article = document.createElement('article');
      article.id = `guide-item-${item.number}`;
      article.setAttribute('aria-label', `${item.number}. ${item.simple_title}`);
      article.appendChild(document.createElement('hr'));
      const choice = document.createElement('label');
      choice.className = 'form-check';
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.className = 'form-check-input';
      input.value = item.id;
      const title = document.createElement('span');
      title.className = 'form-check-label';
      title.textContent = `${item.number}. ${item.simple_title}`;
      choice.append(input, title);
      article.appendChild(choice);
      const scope = document.createElement('div');
      scope.className = 'guide-scope';
      scope.textContent = item.scope_hint;
      article.appendChild(scope);
      const facts = document.createElement('dl');
      facts.className = 'guide-facts';
      for (const [key, label] of fields) {
        const term = document.createElement('dt');
        term.textContent = label;
        const value = document.createElement('dd');
        value.textContent = item[key];
        facts.append(term, value);
      }
      article.appendChild(facts);
      if (item.uncertainty) {
        const caveat = document.createElement('div');
        caveat.textContent = `Что пока неясно: ${item.uncertainty}`;
        article.appendChild(caveat);
      }
      inputById.set(item.id, input);
      input.addEventListener('change', () => {
        if (input.checked) selected.add(item.id);
        else selected.delete(item.id);
        fallback.hidden = true;
        update();
        save();
      });
      section.appendChild(article);
    }
    groups.appendChild(section);
  }

  function choices() { return catalog.items.filter(item => selected.has(item.id)); }
  function makePrompt() {
    const lines = choices().map(item => `${item.number}. ${item.simple_title}`).join('\n');
    return `Для будущего Юлдаша меня заинтересовали пункты из простого справочника (${catalog.id}):\n${lines}\nОбъясни, как они будут сочетаться, что уже есть в Юлдаше и что потребуется сделать. Сначала обсуждаем и составляем план, ничего пока не внедряй. Этот выбор не даёт согласия на платежи, тарифы, изменения реальных данных, публикацию, push или слияние в main.`;
  }
  function update() {
    for (const [id, input] of inputById) input.checked = selected.has(id);
    count.textContent = `Выбрано: ${selected.size}`;
    footerCount.textContent = count.textContent;
    submit.disabled = pending || selected.size === 0;
    text.value = selected.size ? makePrompt() : '';
  }
  function restore(state) {
    const saved = state && state.modelContent;
    const compatible = saved && [catalog.id, catalog.sourceCatalogId, 'go-yuldash-20261019-v1'].includes(saved.catalogId);
    selected = new Set(compatible && Array.isArray(saved.selectedIds) ? saved.selectedIds.filter(id => inputById.has(id)) : []);
    fallback.hidden = true;
    update();
  }
  function save() {
    if (!window.openai || typeof window.openai.setWidgetState !== 'function') return;
    const state = {modelContent:{catalogId:catalog.id,selectedIds:choices().map(item => item.id),selectedNumbers:choices().map(item => item.number)},privateContent:null};
    try { Promise.resolve(window.openai.setWidgetState(state)).catch(() => {}); } catch (_) {}
  }
  window.addEventListener('openai:set_globals', event => {
    const globals = event.detail && event.detail.globals;
    if (globals && Object.prototype.hasOwnProperty.call(globals, 'widgetState')) restore(globals.widgetState);
  });
  submit.addEventListener('click', async () => {
    if (!selected.size || pending) return;
    if (!window.openai || typeof window.openai.sendFollowUpMessage !== 'function') {
      fallback.hidden = false;
      text.focus();
      text.select();
      return;
    }
    pending = true;
    update();
    try { await window.openai.sendFollowUpMessage({prompt:makePrompt(),title:'Обсудить выбранные возможности'}); }
    catch (_) { fallback.hidden = false; }
    finally { pending = false; update(); }
  });
  for (const link of root.querySelectorAll('a[href^="#"]')) {
    link.addEventListener('click', event => {
      const target = root.querySelector(link.getAttribute('href'));
      if (!target) return;
      event.preventDefault();
      target.scrollIntoView({block:'start',behavior:'auto'});
      const control = target.querySelector('input,button:not(:disabled)');
      if (control) control.focus({preventScroll:true});
    });
  }
  restore(window.openai && window.openai.widgetState);
})();
</script>
