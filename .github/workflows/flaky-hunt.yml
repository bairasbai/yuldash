name: Flaky hunt (disposable)

# HUNT ONLY: lives on claude/flaky-hunt-android-20261017, never merged.
# Runs suspect Android unit-test classes many times in one JVM (renamed copies) and prints every failure.
on:
  push:
    branches: [claude/flaky-hunt-android-20261017]

permissions:
  contents: read

concurrency:
  group: flaky-hunt-${{ github.sha }}
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          # Round 5: CouponsScreenWalkTest stale all-cities race (CI PR172). Only the race test runs.
          - { id: k0, variant: K, copies: 200, amp: 0, stress: 0, prefix: HuntK }
          - { id: k4, variant: K, copies: 200, amp: 0, stress: 4, prefix: HuntK }
          - { id: kh0, variant: KH, copies: 200, amp: 0, stress: 0, prefix: HuntKH }
          - { id: kh4, variant: KH, copies: 200, amp: 0, stress: 4, prefix: HuntKH }
          - { id: kw, variant: KW, copies: 5, amp: 0, stress: 0, prefix: HuntKW }
          - { id: kf4, variant: KF, copies: 200, amp: 0, stress: 4, prefix: HuntKF }
          - { id: kfh4, variant: KFH, copies: 200, amp: 0, stress: 4, prefix: HuntKFH }
    name: hunt-${{ matrix.id }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Generate copies
        if: matrix.variant != 'FULL'
        run: python3 ../hunt/gen.py ${{ matrix.variant }} ${{ matrix.copies }} ${{ matrix.amp }}
      - name: Run tests
        run: |
          nproc
          for i in $(seq 1 ${{ matrix.stress }}); do (while :; do :; done) & done
          chmod +x ./gradlew
          if [ "${{ matrix.variant }}" = "FULL" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace || echo "gradle exit $?"
          else
            ./gradlew :app:testDebugUnitTest --tests 'com.yuldash.app.walk.l1_5.${{ matrix.prefix }}*.lateResponseForStaleAllCitiesRequestDoesNotOverwriteNewerCityResult' --no-daemon --stacktrace || echo "gradle exit $?"
          fi
          jobs -p | xargs -r kill || true
      - name: Summary
        if: always()
        run: python3 ../hunt/summary.py ${{ matrix.id }} ${{ matrix.prefix }}
