# Isolated short API probe. Never prints, exports or commits credentials.
name: Gemini API connectivity smoke test

on:
  push:
    branches:
      - chore/gemini-api-smoke-20261123
    paths:
      - .github/workflows/gemini-api-smoke-test.yml

permissions:
  contents: read

jobs:
  gemini-api-probe:
    name: Test listed text-generation and embedding models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Probe all text models with minimal tokens (no multimodal generation)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          from urllib import error, parse, request

          key = os.environ.get("GEMINI_API_KEY", "")
          if not key:
              print("PROBE_ERROR SECRET_MISSING")
              raise SystemExit(2)
          base = "https://generativelanguage.googleapis.com/v1beta"
          headers = {"x-goog-api-key": key, "Content-Type": "application/json"}

          def call(path, payload=None):
              data = json.dumps(payload).encode("utf-8") if payload is not None else None
              req = request.Request(base + path, data=data, headers=headers,
                                    method="POST" if data is not None else "GET")
              try:
                  with request.urlopen(req, timeout=27) as resp:
                      raw = resp.read(262144)
                      return resp.status, json.loads(raw), "OK", "NONE"
              except error.HTTPError as exc:
                  try:
                      body = json.loads(exc.read(8192).decode("utf-8", "replace"))
                      err = body.get("error", {})
                      status = err.get("status", "ERROR")
                      details = err.get("details", [])
                      reason = next((x.get("reason", "NONE") for x in details
                                     if isinstance(x, dict) and x.get("reason")), "NONE")
                  except (ValueError, AttributeError, TypeError):
                      status, reason = "ERROR", "NONE"
                  clean = lambda x: re.sub(r"[^A-Z0-9_]", "", str(x).upper())[:48]
                  return exc.code, None, clean(status), clean(reason)
              except (error.URLError, TimeoutError, OSError):
                  return 0, None, "NETWORK_OR_TIMEOUT", "NONE"
              except (ValueError, TypeError):
                  return 0, None, "INVALID_RESPONSE", "NONE"

          # All known general-purpose text models from the preceding 65-model listing.
          text_ids = [
              "gemini-4-carbon", "gemini-4-argon", "gemini-4-neon", "gemini-4-hydrogen",
              "gemini-3.8-flash", "gemini-3.7-flash", "gemini-3.6-flash",
              "gemini-3.5-flash", "gemini-3.5-flash-lite",
              "gemini-3.1-pro-preview", "gemini-3.1-pro-preview-customtools",
              "gemini-3.1-flash-lite", "gemini-3.1-flash-lite-preview",
              "gemini-3-flash-preview", "gemini-2.5-pro", "gemini-2.5-flash",
              "gemini-2.5-flash-lite", "gemini-pro-latest", "gemini-flash-latest",
              "gemini-flash-lite-latest", "gemma-4-31b-it", "gemma-4-26b-a4b-it",
          ]
          embedding_ids = ["gemini-embedding-001", "gemini-embedding-2-preview", "gemini-embedding-2"]

          listing = []
          page_token = ""
          for page in range(30):
              path = "/models?pageSize=100"
              if page_token:
                  path += "&pageToken=" + parse.quote(page_token, safe="")
              http, body, status, reason = call(path)
              if http != 200:
                  print(f"LIST_ERROR http={http} status={status} reason={reason}", flush=True)
                  raise SystemExit(1)
              listing += body.get("models", [])
              page_token = body.get("nextPageToken", "")
              if not page_token:
                  break
          else:
              print("LIST_ERROR TOO_MANY_PAGES")
              raise SystemExit(1)

          catalog = {m.get("name"): m.get("supportedGenerationMethods", [])
                     for m in listing if isinstance(m, dict)}
          print(f"LIST_OK models={len(listing)} text_target={len(text_ids)} embed_target={len(embedding_ids)}", flush=True)
          stats = {}
          for model_id in text_ids:
              name = "models/" + model_id
              if "generateContent" not in catalog.get(name, []):
                  print(f"TEST {model_id} NOT_LISTED", flush=True)
                  stats[model_id] = "NOT_LISTED"
                  continue
              generation = {
                  "contents": [{"role": "user", "parts": [{"text": "Reply OK."}]}],
                  "generationConfig": {"maxOutputTokens": 256}
              }
              if model_id.startswith("gemini-4-"):
                  generation["generationConfig"]["thinkingConfig"] = {"thinkingLevel": "LOW"}
              started = time.monotonic()
              http, body, status, reason = call("/" + name + ":generateContent", generation)
              seconds = round(time.monotonic() - started, 1)
              if http == 200:
                  candidates = body.get("candidates", []) if isinstance(body, dict) else []
                  text_parts = [p.get("text") for c in candidates if isinstance(c, dict)
                                for p in c.get("content", {}).get("parts", [])
                                if isinstance(p, dict) and isinstance(p.get("text"), str) and p.get("text").strip()]
                  status = "PASS_TEXT" if text_parts else "HTTP200_NO_TEXT"
              print(f"TEST {model_id} http={http} status={status} reason={reason} sec={seconds}", flush=True)
              stats[model_id] = status
              time.sleep(0.3)

          for model_id in embedding_ids:
              name = "models/" + model_id
              if "embedContent" not in catalog.get(name, []):
                  print(f"EMBED {model_id} NOT_LISTED", flush=True)
                  continue
              payload = {"model": name, "content": {"parts": [{"text": "test"}]}}
              http, body, status, reason = call("/" + name + ":embedContent", payload)
              if http == 200:
                  values = body.get("embedding", {}).get("values", []) if isinstance(body, dict) else []
                  status = "PASS_VECTOR" if isinstance(values, list) and len(values) > 0 else "HTTP200_NO_VECTOR"
              print(f"EMBED {model_id} http={http} status={status} reason={reason}", flush=True)

          excluded = sorted(
              name.removeprefix("models/") for name in catalog
              if name not in {"models/" + n for n in text_ids + embedding_ids}
          )
          print(f"SPECIALIZED_NOT_INVOKED count={len(excluded)}", flush=True)
          for model_id in excluded:
              if re.fullmatch(r"[A-Za-z0-9._-]+", model_id):
                  print(f"SPECIALIZED {model_id}", flush=True)
          print("ALL_PROBES_FINISHED", flush=True)
          PY
