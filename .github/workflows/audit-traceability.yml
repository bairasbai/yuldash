name: Audit traceability tooling

on:
  pull_request:
    paths:
      - 'tools/audit_traceability/**'
      - 'docs/audit-traceability/**'
      - '.claude/skills/audit-traceability/**'
      - '.claude/skills/gotovo/SKILL.md'
      - '.github/workflows/audit-traceability.yml'
      - 'AGENTS.md'
  push:
    branches: [main]
    paths:
      - 'tools/audit_traceability/**'
      - 'docs/audit-traceability/**'
      - '.claude/skills/audit-traceability/**'
      - '.claude/skills/gotovo/SKILL.md'
      - '.github/workflows/audit-traceability.yml'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: traceability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  self-tests:
    name: Tool self-tests (${{ matrix.os }}), not product acceptance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check original validator and Yuldash integration contracts
        run: python -B tools/audit_traceability/run_tests.py
