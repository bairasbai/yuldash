name: Android taxi draft on emulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-taxi-draft-emulator.yml'
      - 'tools/taxi_consent_emulator/**'
      - 'android/app/build.gradle.kts'
      - 'android/settings.gradle.kts'
      - 'android/taxiDraftObserver/**'
      - 'android/app/src/taxiDraftQa/**'
      - 'android/app/src/main/java/com/yuldash/app/*Taxi*Draft*.kt'
      - 'android/app/src/main/java/com/yuldash/app/InstantOrderScreen.kt'
      - 'android/app/src/main/java/com/yuldash/app/data/ApiClient.kt'

permissions:
  contents: read

jobs:
  taxi-draft-emulator:
    name: Taxi draft (${{ matrix.scenario }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [baseline, restore, restore-ba, delayed, relogin, alternate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YULDASH_DEBUG_API_BASE_URL: http://127.0.0.1:8000
      YULDASH_NATIVE_QA_PINNED_API: 'true'
      YULDASH_TAXI_QUOTE_CONSENT_LOCAL: 'true'
      YULDASH_TAXI_DRAFT_DEVICE_QA: 'true'
      TAXI_DRAFT_VARIANT: ${{ matrix.scenario == 'baseline' && 'baseline' || 'candidate' }}
      TAXI_DRAFT_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.scenario == 'baseline' && '0' || '1' }}
      - name: Use the exact production source from PR 289 for the control
        if: matrix.scenario == 'baseline'
        env:
          BASELINE: 6548bf38f66ef9902cf0ad000e51c5ada85af8d9
        run: |
          git restore --source="$BASELINE" --staged --worktree -- android/app/src/main
          git diff --exit-code "$BASELINE" -- android/app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Build the selected production source against the isolated emulator API
        working-directory: android
        run: bash gradlew --no-daemon :app:assembleDebug :taxiDraftObserver:assembleDebug --stacktrace
      - name: Install the local backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Allow runner access to KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Restore the same Android task after a background process kill
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # Android Emulator 37.2.13, the previous stable Linux host build. The guest stays API 30.
          emulator-build: 16740729
          profile: pixel_2
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: TAXI_DRAFT_ONLY=true bash tools/taxi_consent_emulator/run.sh
      - name: Save lifecycle evidence and synthetic UI frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxi-draft-${{ matrix.scenario }}
          path: android/build/taxi-consent-emulator
          if-no-files-found: ignore
          retention-days: 7
