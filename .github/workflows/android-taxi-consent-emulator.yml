name: Android taxi consent on emulator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-taxi-consent-emulator.yml'
      - 'tools/taxi_consent_emulator/**'
      - 'android/app/src/**/java/**/Taxi*Consent*.kt'
      - 'android/app/src/main/java/com/yuldash/app/InstantOrderScreen.kt'
      - 'backend/app/taxi_quote_consent.py'
      - 'backend/app/routers/instant.py'

permissions:
  contents: read

jobs:
  taxi-consent-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      YULDASH_DEBUG_API_BASE_URL: http://127.0.0.1:8000
      YULDASH_NATIVE_QA_PINNED_API: 'true'
      YULDASH_TAXI_QUOTE_CONSENT_LOCAL: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Build loopback-only debug and instrumentation APKs
        working-directory: android
        run: bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PstorageAuditRunner=com.yuldash.app.StorageAuditRunner --stacktrace
      - name: Install backend test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Allow runner access to KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Run the two interrupted orders on a fresh emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/taxi_consent_emulator/run.sh
      - name: Save instrumented results and UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taxi-consent-emulator
          path: android/build/taxi-consent-emulator
          if-no-files-found: ignore
          retention-days: 7
