name: Gemini reviewer offline self-tests

on:
  push:
    branches: [chore/gemini36-reviewer-20261123]
    paths:
      - '.github/scripts/gemini36_pr_review.py'
      - '.github/tests/test_gemini36_pr_review.py'
      - '.github/workflows/gemini36-reviewer-tests.yml'
  pull_request:
    paths:
      - '.github/scripts/gemini36_pr_review.py'
      - '.github/tests/test_gemini36_pr_review.py'
      - '.github/workflows/gemini36-reviewer-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test reviewer without secrets
        run: |
          python -m py_compile .github/scripts/gemini36_pr_review.py
          python -m unittest discover -s .github/tests -p 'test_gemini36_pr_review.py' -v
