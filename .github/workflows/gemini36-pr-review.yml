# Trusted-base workflow: never executes PR head code, never checks out a fork.
# Activation requires an explicit merge to main; this branch is only a proposal.
name: Gemini 3.6 Flash independent PR review

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: gemini36-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  independent-review:
    name: Static PR diff review (not acceptance)
    if: >-
      vars.YULDASH_GEMINI_PR_DIFF == 'true' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout trusted workflow revision only (never PR code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Review changes with Gemini 3.6 Flash
        env:
          YULDASH_GEMINI_PR_DIFF: ${{ vars.YULDASH_GEMINI_PR_DIFF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          YULDASH_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 -B .github/scripts/gemini36_pr_review.py
