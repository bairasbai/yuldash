name: CI

# Ловит регрессии (бэкенд-тесты) автоматически.
# Триггеры: PR (любая ветка) + push в main. Раньше было `push:` + `pull_request:` —
# это давало ДВА прогона на каждый пуш в ветку с открытым PR (событие push + событие
# pull_request). Теперь ветки проверяются через свой PR (одно событие), main — на push.
on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку/PR отменяет предыдущий незавершённый прогон — минуты не горят вхолостую.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # зависший тест не сожрёт дефолтные 360 минут лимита Actions
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip             # кеш зависимостей → быстрее прогон, меньше минут
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run tests
        # Coverage-gate: покрытие пакета app/. Порог мягкий (70%) на старте, чтобы не
        # заваливать PR-ы — поднять до 80 по мере роста покрытия. term-missing показывает
        # непокрытые строки прямо в логе. Тесты на изолированной SQLite (conftest), прод-БД не нужна.
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=70

  # Android debug-сборка в CI (закрывает разрыв: раньше APK собирался только локально у Александра).
  # БЛОКИРУЮЩИЙ: сборка стабильно зелёная (стек такси+курьер+монетизация+доводка собран многократно),
  # поэтому красный android-build теперь честно валит PR — реальный компилятор Kotlin в CI.
  #   * google-services.json (FCM) и local.properties (ключи MapKit/геокодера) в git НЕ лежат —
  #     build.gradle.kts к их отсутствию терпим (push неактивен, ключи пустые).
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30          # первая сборка тянет зависимости — с запасом
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"     # проект собирается на JDK 17 (jvmTarget/sourceCompatibility = 17)
          cache: gradle          # кеш ~/.gradle → быстрее повторные сборки
      - uses: android-actions/setup-android@v3
      - name: Собрать debug APK
        # local.properties/google-services.json в git нет — build.gradle.kts подставляет
        # безопасные дефолты (пустые ключи, push выключен), так что сборка проходит без секретов.
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace
