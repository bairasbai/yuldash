name: CI

# Ловит регрессии (бэкенд-тесты) автоматически.
# Триггеры: PR (любая ветка) + push в main. Раньше было `push:` + `pull_request:` —
# это давало ДВА прогона на каждый пуш в ветку с открытым PR (событие push + событие
# pull_request). Теперь ветки проверяются через свой PR (одно событие), main — на push.
on:
  pull_request:
  push:
    branches: [main]

# Новый пуш в ту же ветку/PR отменяет предыдущий незавершённый прогон — минуты не горят вхолостую.
# Но только для PR: на main отмена оставляла бы «дыры» в истории прогонов при частых пушах.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # зависший тест не сожрёт дефолтные 360 минут лимита Actions
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip             # кеш зависимостей → быстрее прогон, меньше минут
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff — мёртвые импорты/переменные, F-правила)
        # Быстрый гейт: ловит забытые/неиспользуемые импорты и переменные до прогона тестов.
        # Только F-набор (Pyflakes) — без спорного стиля, чтобы не заваливать PR-ы по мелочи.
        run: ruff check app/ --select F
      - name: Run tests
        # Coverage-gate: покрытие пакета app/. Порог мягкий (70%) на старте, чтобы не
        # заваливать PR-ы — поднять до 80 по мере роста покрытия. term-missing показывает
        # непокрытые строки прямо в логе. Тесты на изолированной SQLite (conftest), прод-БД не нужна.
        run: python -m pytest tests/ -q --cov=app --cov-report=term-missing --cov-fail-under=70

  # Тот же набор тестов, но на РЕАЛЬНОМ Postgres (как в проде на yulbash.ru), а не на SQLite.
  # Зачем отдельная джоба: SQLite не проверяет внешние ключи и не даёт настоящих блокировок строк.
  # На Postgres прогоняется настоящая гонка брони (test_overbooking_concurrent — потоки под FOR UPDATE)
  # и включён контроль FK — это доказывает, что новые блокировки денег/брони держат нагрузку.
  # Плюс валидируем миграции alembic (одна голова, upgrade/downgrade идемпотентны) на реальной БД.
  backend-tests-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16          # как в проде; UTF-8 по умолчанию (кириллица в тестовых данных)
        env:
          POSTGRES_USER: yuldash
          POSTGRES_PASSWORD: yuldash
          POSTGRES_DB: yuldash_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Alembic — одна голова + upgrade/downgrade идемпотентны (на Postgres)
        # Валидируем миграции на реальной БД: ровно одна голова, полный upgrade → downgrade → upgrade.
        # Гоняем на отдельной базе yuldash_test, чтобы не пересекаться с create_all тестового прогона.
        env:
          DATABASE_URL: postgresql+psycopg2://yuldash:yuldash@localhost:5432/yuldash_test
        run: |
          heads=$(alembic heads 2>/dev/null | grep -c 'head' || true)
          if [ "$heads" != "1" ]; then echo "Ожидалась одна голова alembic, получено: $heads"; alembic heads; exit 1; fi
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Отдельная чистая база под тестовый прогон
        # conftest поднимает схему через create_all; даём ему свежую базу, не тронутую alembic-шагом.
        run: PGPASSWORD=yuldash psql -h localhost -U yuldash -d yuldash_test -c "CREATE DATABASE yuldash_run;"
      - name: Run tests on Postgres (FK + реальная гонка брони под FOR UPDATE)
        env:
          DATABASE_URL: postgresql+psycopg2://yuldash:yuldash@localhost:5432/yuldash_run
        run: python -m pytest tests/ -q

  # Android debug-сборка в CI (закрывает разрыв: раньше APK собирался только локально у Александра).
  # БЛОКИРУЮЩИЙ: сборка стабильно зелёная (стек такси+курьер+монетизация+доводка собран многократно),
  # поэтому красный android-build теперь честно валит PR — реальный компилятор Kotlin в CI.
  #   * google-services.json (FCM) и local.properties (ключи MapKit/геокодера) в git НЕ лежат —
  #     build.gradle.kts к их отсутствию терпим (push неактивен, ключи пустые).
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # две сборки + ~1100 юнит-тестов; первая сборка ещё и тянет зависимости
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"     # проект собирается на JDK 17 (jvmTarget/sourceCompatibility = 17)
          cache: gradle          # кеш ~/.gradle → быстрее повторные сборки
      - uses: android-actions/setup-android@v3
      - name: Собрать debug APK
        # local.properties/google-services.json в git нет — build.gradle.kts подставляет
        # безопасные дефолты (пустые ключи, push выключен), так что сборка проходит без секретов.
        run: chmod +x ./gradlew && ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # Релизная сборка с R8 (minify+shrink): ловит «в debug работало, в release упало» —
      # вырезанные R8 классы (рефлексия/JSON/MapKit). Без keystore → неподписанный APK, для проверки достаточно.
      - name: Build release (R8 minify check)
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Юнит-тесты приложения (~1100 @Test). Раньше в CI НЕ гонялись вообще — собирался только
      # APK, а тесты запускал вручную Александр. То есть регрессию в логике экранов CI не ловил.
      # Идут после сборок: если упал компилятор, причина видна раньше и понятнее.
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # Отчёт по упавшим тестам — иначе в логе только «FAILED», а какой именно assert не сошёлся,
      # приходится угадывать. Заливаем только при провале, чтобы не копить артефакты на зелёных прогонах.
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
