<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden;
    font-family: "Inter", system-ui, sans-serif;
    color: #EAF2EC;
    background: radial-gradient(120% 120% at 18% -10%, #16291e 0%, #0c1813 55%, #070f0b 100%);
    display: flex; flex-direction: column; justify-content: center;
    padding: 86px;
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(120px); }
  .b1 { width: 540px; height: 540px; top: -180px; right: -120px; background: rgba(47,179,110,.30); }
  .b2 { width: 420px; height: 420px; bottom: -200px; left: 120px; background: rgba(216,155,18,.18); }

  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 40px; position: relative; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; }
  .brand b { font-family: "Sora"; font-weight: 800; font-size: 38px; letter-spacing: -.5px; }

  h1 { position: relative; font-family: "Sora"; font-weight: 800; font-size: 96px; line-height: 1.02; letter-spacing: -2px; }
  .grad {
    background: linear-gradient(100deg, #7FE3AB 0%, #2FB36E 40%, #E8C36B 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  p.sub { position: relative; margin-top: 28px; font-size: 34px; font-weight: 500; color: #A9BCB1; max-width: 760px; }

  .row { position: relative; margin-top: 52px; display: flex; align-items: center; gap: 22px; }
  .pill { display: inline-flex; align-items: center; gap: 12px; background: #2FB36E; color: #0A1410; font-family: "Sora"; font-weight: 700; font-size: 28px; padding: 18px 34px; border-radius: 999px; }
  .pill svg { width: 28px; height: 28px; }
  .dom { font-size: 28px; font-weight: 600; color: #7FE3AB; }
</style>
</head>
<body>
  <span class="blob b1"></span><span class="blob b2"></span>

  <div class="brand"><img src="/public/logo.png" alt="" /><b>Юлдаш</b></div>
  <h1>Доедем <span class="grad">вместе</span></h1>
  <p class="sub">Попутки по Башкортостану между своими. Доверие, тёплые поездки и честная цена.</p>

  <div class="row">
    <span class="pill">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
      Скачать для Android
    </span>
    <span class="dom">yulbash.ru</span>
  </div>
</body>
</html>
